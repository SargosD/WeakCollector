name: weakcollector

services:
  weak-api:
    build:
      context: ./weak-api
    ports:
      - "${WEAKAPI_PORT:-8080}:8080"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-weakcollector}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-weakcollector}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weakcollector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weakcollector}
      POSTGRES_DB: ${POSTGRES_DB:-weakcollector}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: ./backend
      dockerfile: WeakCollector.Data/Dockerfile
    command: ["--connection", "${DATABASE_CONNECTION_STRING}"]
    depends_on:
      postgres:
        condition: service_healthy

  ingestor:
    build:
      context: ./backend
      dockerfile: WeakCollector.Ingestor/Dockerfile
    environment:
      WeakApi__BaseUrl: http://weak-api:8080
      WeakApi__ApiKey: ${WEAKAPI_KEY:-supersecret}
      WeakApi__PollIntervalSeconds: ${POLL_INTERVAL_SECONDS:-60}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__User: ${RABBITMQ_USER:-weakcollector}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-weakcollector}
    depends_on:
      weak-api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      processor:
        condition: service_started
    restart: unless-stopped

  processor:
    build:
      context: ./backend
      dockerfile: WeakCollector.Processor/Dockerfile
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__User: ${RABBITMQ_USER:-weakcollector}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-weakcollector}
      Database__ConnectionString: ${DATABASE_CONNECTION_STRING}
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  graphql-api:
    build:
      context: ./backend
      dockerfile: WeakCollector.GraphQL.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: ${DATABASE_CONNECTION_STRING}
    ports:
      - "${GRAPHQL_API_PORT:-5000}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  notifier:
    build:
      context: ./backend
      dockerfile: WeakCollector.Notifier/Dockerfile
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__User: ${RABBITMQ_USER:-weakcollector}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-weakcollector}
    ports:
      - "${NOTIFIER_PORT:-5001}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      GRAPHQL_URL: ${GRAPHQL_URL:?GRAPHQL_URL is required}
      NOTIFIER_URL: ${NOTIFIER_URL:-http://notifier:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      graphql-api:
        condition: service_started
      notifier:
        condition: service_started
    restart: unless-stopped

volumes:
  rabbitmq-data:
  postgres-data:
