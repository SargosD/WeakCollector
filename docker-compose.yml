name: weakcollector

x-dotnet-healthcheck: &dotnet-healthcheck
  test:
    - CMD-SHELL
    - >-
      bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080
      && printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3
      && grep -q "200 OK" <&3'
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  weak-api:
    build:
      context: ./weak-api
    ports:
      - "${WEAKAPI_PORT:-8080}:8080"
    healthcheck: *dotnet-healthcheck

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-weakcollector}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-weakcollector}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weakcollector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weakcollector}
      POSTGRES_DB: ${POSTGRES_DB:-weakcollector}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestor:
    build:
      context: ./backend
      dockerfile: src/WeakCollector.Ingestor/Dockerfile
    depends_on:
      weak-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  processor:
    build:
      context: ./backend
      dockerfile: src/WeakCollector.Processor/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ./backend
      dockerfile: src/WeakCollector.Gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck
    restart: unless-stopped

  notifier:
    build:
      context: ./backend
      dockerfile: src/WeakCollector.Notifier/Dockerfile
    ports:
      - "${NOTIFIER_PORT:-5001}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      gateway:
        condition: service_healthy
      notifier:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rabbitmq-data:
  postgres-data:
