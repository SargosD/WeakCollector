name: ingestor

on:
  push:
    branches: [main]
    paths:
      - "backend/WeakCollector.Ingestor/**"
      - "backend/WeakCollector.Common/**"
      - "backend/WeakCollector.Messaging/**"
      - "backend/WeakCollector.Ingestor.Tests/**"
      - "backend/Directory.*.props"
      - "backend/global.json"
      - "backend/nuget.config"
      - "backend/stylecop.json"
      - "backend/.editorconfig"
      - ".github/workflows/ingestor.yml"
  pull_request:
    paths:
      - "backend/WeakCollector.Ingestor/**"
      - "backend/WeakCollector.Common/**"
      - "backend/WeakCollector.Messaging/**"
      - "backend/WeakCollector.Ingestor.Tests/**"
      - "backend/Directory.*.props"
      - "backend/global.json"
      - "backend/nuget.config"
      - "backend/stylecop.json"
      - "backend/.editorconfig"
      - ".github/workflows/ingestor.yml"

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore WeakCollector.Ingestor.Tests/WeakCollector.Ingestor.Tests.csproj

      - name: Lint
        run: dotnet format WeakCollector.Ingestor.Tests/WeakCollector.Ingestor.Tests.csproj --verify-no-changes --no-restore

      - name: Build
        run: dotnet build WeakCollector.Ingestor.Tests/WeakCollector.Ingestor.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test --project WeakCollector.Ingestor.Tests/WeakCollector.Ingestor.Tests.csproj --configuration Release --no-build

      - name: Docker build
        run: docker build --file WeakCollector.Ingestor/Dockerfile --tag weakcollector-ingestor:${{ github.sha }} .
