query LatestReadings {
  latestMeterReadings {
    id
    location
    polledAt
    type
    measurements {
      id
      name
      value
      valueType
    }
  }
}

query Metrics($range: TimeRange!) {
  metrics(range: $range) {
    type
    name
    valueType
  }
}

query Aggregation(
  $type: String!
  $name: String!
  $range: TimeRange!
  $aggregate: AggregateFunction!
) {
  aggregation(type: $type, name: $name, range: $range, aggregate: $aggregate) {
    location
    value
  }
}

query MeasurementTrend(
  $type: String!
  $name: String!
  $range: TimeRange!
  $aggregate: AggregateFunction!
) {
  measurementTrend(type: $type, name: $name, range: $range, aggregate: $aggregate) {
    location
    polledAt
    value
  }
}
